name: Compilar SwiftUI CrossPreview

on:
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts evita compilar los módulos nativos de tree-sitter
      # (node-gyp falla con Node 22). La extensión ya usa su parser regex
      # de respaldo cuando tree-sitter no está disponible, y el VSIX no
      # incluye node_modules, así que esos binarios nunca se empaquetaban.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Compilar plugin
        run: npm run build

      - name: Generar VSIX
        run: npm run package

      - name: Guardar plugin descargable
        uses: actions/upload-artifact@v4
        with:
          name: SwiftUI-CrossPreview
          path: '*.vsix'
          if-no-files-found: error
